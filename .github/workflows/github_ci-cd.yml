name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # --------------------------------------------------------
  # 1. Backend CI Job: Lint, Setup Dependencies, Run Unit Tests
  # --------------------------------------------------------
  backend-ci:
    name: Backend CI (FastAPI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run backend unit tests
        run: |
          python -m unittest discover -s tests

  # --------------------------------------------------------
  # 2. Frontend CI Job: Setup Node.js, Build Vite App & Lint
  # --------------------------------------------------------
  frontend-ci:
    name: Frontend CI (Vite & React)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "app/package-lock.json"

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Run type check & build production bundle
        working-directory: app
        run: npm run build

  # --------------------------------------------------------
  # 3. CD Deployment Pipeline (Runs after CI checks pass)
  # --------------------------------------------------------
  deploy:
    name: Deploy Application
    needs: [backend-ci, frontend-ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Simulate Deployment Pipeline
        run: |
          echo "CI checks passed successfully!"
          echo "Deploying Proactive application to production..."
